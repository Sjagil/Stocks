[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv-ibkr",
  "reference_repos",
  "output",
  "data",
  "backups",
  ".codex-backups",
  ".codex_backups",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference_repos", ".git", ".venv", ".venv-ibkr"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = "(^reference_repos/|^output/|^data/)"
